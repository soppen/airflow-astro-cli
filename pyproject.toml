[project]
name = "airflow-astro-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rikard Isaksson", email = "rikard.isaksson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "clickhouse-connect>=1.11.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
]

[project.scripts]
airflow-astro-cli = "airflow_astro_cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "airflow",
]
